name: Auto-merge main to action-test

# Trigger this workflow when code is pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push changes to branches
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main to action-test
        run: |
          # Fetch the latest changes
          git fetch origin
          
          # Check if action-test branch exists remotely
          if git ls-remote --heads origin action-test | grep -q "refs/heads/action-test$"; then
            echo "Branch 'action-test' exists, checking out..."
            git checkout action-test
            git pull origin action-test
          else
            echo "Branch 'action-test' does not exist, creating..."
            git checkout -b action-test
          fi
          
          # Merge main into action-test with error handling
          echo "Merging main into action-test..."
          if ! git merge origin/main -m "Auto-merge main to action-test"; then
            echo "❌ Merge failed due to conflicts!"
            echo "Manual intervention is required to resolve conflicts."
            echo "Please resolve conflicts manually and push to action-test branch."
            exit 1
          fi
          
          # Push the changes
          echo "✅ Merge successful, pushing to action-test..."
          git push origin action-test
          echo "✅ Auto-merge completed successfully!"
