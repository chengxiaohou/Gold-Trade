name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: '分支或 ref，用于手动触发（默认: main）'
        required: false
        default: 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      # 用于清理本 run 内重复的 github-pages artifact（重跑时会产生同名副本）
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        # 必须用 package-lock.json 安装：lightweight-charts 存在 patches/ 里的补丁，
        # 一旦删掉 lock 让 npm 自由解析到更高版本，postinstall 的 patch-package 就会因版本不符而失败
        run: npm ci --no-audit --no-fund

      - name: Build
        env:
          # 自动将库名作为 base，例如 "/Gold-Trade/"
          # 使用 github.event.repository.name 来获取仓库名以避免 github.repository.name 在某些上下文中为空导致 base 为 "//"
          VITE_BASE: '/${{ github.event.repository.name }}/'
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3
        with:
          # 尝试自动启用 Pages（当仓库未启用 Pages 时有用）
          enablement: true

      - name: Clean stale pages artifacts
        # 重跑（gh run rerun）会让同一个 run 里出现多份同名 artifact，
        # deploy-pages@v4 会直接报 "Multiple artifacts named \"github-pages\" were unexpectedly found" 失败。
        # 上传前先删掉本 run 里已存在的同名 artifact，保证始终只有一份，重跑即安全。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --paginate --jq '.artifacts[] | select(.name=="github-pages") | .id' \
          | while read -r id; do
              if [ -n "$id" ]; then
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
              fi
            done

      - name: Upload artifact
        # 使用 v4 以避免依赖已弃用的 artifact actions v3
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deploy
        # 使用最新稳定的 v4 版 deploy-pages
        uses: actions/deploy-pages@v4
        # 刚上传完 artifact 时偶发查不到（Found 0 artifact(s)），失败后等几秒重试一次
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 10

      - name: Deploy to GitHub Pages (retry)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
