name: Deploy to GitHub Pages

on:
  push:
    branches:
      - Action-Test
  workflow_dispatch:
    inputs:
      ref:
        description: '分支或 ref，用于手动触发（默认: Action-Test）'
        required: false
        default: 'Action-Test'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # 自动将库名作为 base，例如 "/Gold-Trade/"
          VITE_BASE: '/${{ github.repository.name }}/'
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
